apiVersion: v1
kind: Pod
metadata:
  name: chunk-norris-debug
  namespace: website-builder-assistant-dev
spec:
  serviceAccountName: website-builder-assistant-dev-service
  containers:
    - name: scraper
      image: 754256621582.dkr.ecr.eu-west-2.amazonaws.com/jotw-content-devs/website-builder-assistant-dev-chunk-norris-ecr:latest
      imagePullPolicy: Always
      command: ["sh", "-c", "echo 'Debug pod ready' && sleep 3600"]
      env:
        - name: PUBLIC_BASE_URL
          value: "https://websitebuilder.service.justice.gov.uk"
        - name: SITE_IDS
          value: "1"
        - name: OUTPUT_DIR
          value: "wordpress-content"
        - name: ENV
          value: "prod"
        - name: S3_BUCKET
          value: "cloud-platform-69f5cec4ef010c4aa8746dab4cda322a"
        - name: S3_REGION
          value: "eu-west-2"
        - name: S3_PREFIX
          value: "wordpress-content/"
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
  restartPolicy: Never
